name: ospf-lab

# ============================================================
#  Lab 01 — OSPF Fundamentals
#  Author: Adrian S. Obungu
#
#  Topology:
#    [PC1]──eth1──[R1]──eth1──[R2]──eth2──[PC2]
#                      Area 0 Backbone
#
#  Objectives:
#    1. Configure OSPF Area 0 between R1 and R2
#    2. Verify Full adjacency state
#    3. Inspect LSDB synchronisation
#    4. Confirm end-to-end reachability PC1 → PC2
# ============================================================

topology:
  nodes:

    R1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/R1/frr.conf:/etc/frr/frr.conf
        - configs/R1/daemons:/etc/frr/daemons
      exec:
        - ip addr add 10.0.1.1/30 dev eth1
        - ip addr add 192.168.1.1/24 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up

    R2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/R2/frr.conf:/etc/frr/frr.conf
        - configs/R2/daemons:/etc/frr/daemons
      exec:
        - ip addr add 10.0.1.2/30 dev eth1
        - ip addr add 192.168.2.1/24 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up

    PC1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.1.10/24 dev eth1
        - ip route replace default via 192.168.1.1
        - ip link set eth1 up

    PC2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.2.10/24 dev eth1
        - ip route replace default via 192.168.2.1
        - ip link set eth1 up

  links:
    - endpoints: ["R1:eth1", "R2:eth1"]
    - endpoints: ["R1:eth2", "PC1:eth1"]
    - endpoints: ["R2:eth2", "PC2:eth1"]
